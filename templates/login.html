{% extends "base.html" %}
{% block title %}{{ t('login_title') }} – {{ brand }}{% endblock %}
{% block content %}
<main class="max-w-md mx-auto px-4 py-10">
  <div class="bg-white rounded-xl shadow p-6">
    <h1 class="text-xl font-bold mb-4">{{ t('login_title') }}</h1>
    <form method="post" class="space-y-4">
      <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
      <input type="hidden" name="next" value="{{ request.args.get('next', '') }}">
      <div>
        <label class="block text-sm font-semibold mb-1">{{ t('f_email') }}</label>
        <input type="email" name="email" required autocomplete="email" value="{{ form.get('email', '') }}"
               class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm">
      </div>
      <div>
        <label class="block text-sm font-semibold mb-1">{{ t('f_password') }}</label>
        <input type="password" name="password" required autocomplete="current-password"
               class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm">
      </div>
      <button class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold rounded-lg px-4 py-2.5">{{ t('login_title') }}</button>
    </form>
    <p class="text-sm text-slate-500 mt-4">{{ t('no_account') }}
      <a class="text-blue-700 font-semibold" href="{{ url_for('register', next=request.args.get('next')) }}">{{ t('nav_register') }}</a></p>
  </div>
</main>
{% endblock %}
