# Render Blueprint (optional - you can also set these in the Render dashboard).
# Data now lives OUTSIDE the web service:
#   * PostgreSQL  -> DATABASE_URL   (users + listings)
#   * Cloudinary  -> CLOUDINARY_URL (photos)
# so no persistent disk is needed and nothing is lost when the service restarts.
services:
  - type: web
    name: bosaso-homes
    runtime: python
    plan: free            # change to "starter" to remove the ~50s cold start
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 1 --threads 4 --timeout 60
    healthCheckPath: /healthz
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL         # paste your PostgreSQL connection string
        sync: false
      - key: CLOUDINARY_URL       # cloudinary://API_KEY:API_SECRET@CLOUD_NAME
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: GOOGLE_EMBED_API_KEY # optional: free Google Maps tab on listing pages (key needs billing enabled)
        sync: false
      - key: GOOGLE_MAPS_API_KEY  # optional: adds Google Maps layers (needs billing)
        sync: false
      - key: ADMIN_WHATSAPP       # optional: office number (2529...)
        sync: false
      - key: SEED_SAMPLES         # 0 = start with an empty marketplace
        value: "0"
      - key: BRAND_NAME
        value: Puntland Homes
